# Draws the contribution "snake" (Platane/snk) from this account's own contribution graph, in Cursed
# colours, twice a day, and publishes the SVGs to the "output" branch for the README to show.
name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#e0408a&color_dots=#161b22,#3d1430,#6e1d52,#a62877,#f088e9
            dist/snake-light.svg?color_snake=#e0408a&color_dots=#ebedf0,#c9e6f5,#7cc3e6,#34a9e3,#007ab7
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}