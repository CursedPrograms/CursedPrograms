# Rebuilds the README's cards (images/stats.svg, streak.svg, top-langs.svg) every day.
# Replaces github-readme-stats and streak-stats on Vercel, whose public instances are paused, and draws Futura.
name: Profile cards

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/profile_cards.py
      - .github/workflows/top-langs.yml

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/profile_cards.py CursedPrograms
      - name: Commit if it changed
        run: |
          if git diff --quiet -- images/*.svg && [ -z "$(git ls-files --others -- images/*.svg)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*.svg
          git commit -m "Update the profile cards"
          git push
